<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BirdVisionAI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        to bottom,
        #6ec6ff,
        #87ceeb,
        #bdefff
    );
}

/* NUVENS */

.cloud{
    position:absolute;
    background:white;
    border-radius:50px;
    opacity:0.8;
}

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud1{
    width:120px;
    height:40px;
    top:80px;
    left:-150px;
    animation:nuvem 25s linear infinite;
}

.cloud1::before{
    width:50px;
    height:50px;
    left:15px;
    top:-20px;
}

.cloud1::after{
    width:60px;
    height:60px;
    right:15px;
    top:-25px;
}

.cloud2{
    width:180px;
    height:55px;
    top:180px;
    left:-250px;
    animation:nuvem 35s linear infinite;
}

.cloud2::before{
    width:60px;
    height:60px;
    left:20px;
    top:-20px;
}

.cloud2::after{
    width:80px;
    height:80px;
    right:20px;
    top:-30px;
}

@keyframes nuvem{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(2000px);
    }
}

/* MONTANHAS CARTOON */

.mountain{
    position:absolute;
    bottom:-50px;
    border-radius:50%;
    filter:drop-shadow(0 5px 10px rgba(0,0,0,.2));
}

.mountain::before{
    content:"";
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:120px;
    height:80px;
    background:white;
    border-radius:50%;
}

.m1{
    left:-100px;
    width:500px;
    height:400px;

    background:
    radial-gradient(
        circle at top,
        #8bc34a 0%,
        #4caf50 60%,
        #2e7d32 100%
    );
}

.m2{
    left:250px;
    width:600px;
    height:450px;

    background:
    radial-gradient(
        circle at top,
        #9ccc65 0%,
        #43a047 60%,
        #1b5e20 100%
    );
}

.m3{
    right:-150px;
    width:550px;
    height:420px;

    background:
    radial-gradient(
        circle at top,
        #aed581 0%,
        #66bb6a 60%,
        #2e7d32 100%
    );
}

.mountain::before{
    content:"";
    position:absolute;

    top:20px;
    left:50%;

    transform:translateX(-50%);

    width:120px;
    height:80px;

    background:white;

    border-radius:
    50% 50%
    40% 40%;
}

/* PAINEL */

.container{
    position:relative;
    z-index:10;

    background:white;
    padding:30px;
    border-radius:25px;

    width:420px;

    text-align:center;

    box-shadow:0 0 25px rgba(0,0,0,0.25);
}

h1{
    color:#ff9800;
    margin-bottom:15px;
}

.passaro{
    width:150px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;

    border-radius:10px;
    border:2px solid #ddd;

    font-size:16px;

    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;

    border:none;
    border-radius:10px;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
    margin-top:10px;
}

#entrar{
    background:#4caf50;
    color:white;
}

#entrar:hover{
    background:#43a047;
}

.ranking{
    margin-top:20px;
    text-align:left;
}

.ranking h2{
    text-align:center;
    color:#ff9800;
    margin-bottom:10px;
}

.ranking p{
    margin:5px 0;
}

</style>
</head>
<body>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<div class="mountain m1"></div>
<div class="mountain m2"></div>
<div class="mountain m3"></div>

<div class="container">

    <h1>🐦 BirdVisionAI</h1>

    <!-- SUA IMAGEM -->
    <img
        src="passaro.png"
        class="passaro"
        alt="Passarinho">

    <input
        type="text"
        id="nome"
        placeholder="Digite seu nome">

    <button id="entrar">
        Jogar
    </button>

    <div class="ranking">
        <h2>🏆 TOP 5 Mundial</h2>

        <div id="rankingInicial">
            Carregando ranking...
        </div>
    </div>

</div>

<script type="module" src="login.js"></script>

<script type="module">

import {
    db,
    ref,
    onValue
} from "./firebase.js";

const rankingDiv =
    document.getElementById("rankingInicial");

onValue(ref(db, "ranking"), (snapshot) => {

    const dados = snapshot.val();

    if (!dados) {
        rankingDiv.innerHTML =
            "<p>Nenhuma pontuação ainda.</p>";
        return;
    }

    const ranking =
        Object.values(dados)
        .sort((a,b) => b.pontos - a.pontos)
        .slice(0,5);

    let html = "";

    ranking.forEach((jogador,index)=>{

        html += `
            <p>
                ${index + 1}º
                ${jogador.nome}
                - ${jogador.pontos}
            </p>
        `;

    });

    rankingDiv.innerHTML = html;

});

</script>
</body>
</html>
