<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BirdVisionAI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        to bottom,
        #6ec6ff,
        #87ceeb,
        #bdefff
    );
}

/* NUVENS */

.cloud{
    position:absolute;
    background:white;
    border-radius:50px;
    opacity:0.8;
}

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud1{
    width:120px;
    height:40px;
    top:80px;
    left:-150px;
    animation:nuvem 25s linear infinite;
}

.cloud1::before{
    width:50px;
    height:50px;
    left:15px;
    top:-20px;
}

.cloud1::after{
    width:60px;
    height:60px;
    right:15px;
    top:-25px;
}

.cloud2{
    width:180px;
    height:55px;
    top:180px;
    left:-250px;
    animation:nuvem 35s linear infinite;
}

.cloud2::before{
    width:60px;
    height:60px;
    left:20px;
    top:-20px;
}

.cloud2::after{
    width:80px;
    height:80px;
    right:20px;
    top:-30px;
}

@keyframes nuvem{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(2000px);
    }
}

/* MONTANHAS */

.mountain{
    position:absolute;
    bottom:0;
    width:0;
    height:0;
    border-left:250px solid transparent;
    border-right:250px solid transparent;
    border-bottom:350px solid #4caf50;
}

.m1{
    left:-50px;
}

.m2{
    left:250px;
    border-bottom-color:#388e3c;
}

.m3{
    right:-50px;
}

/* PAINEL */

.container{
    position:relative;
    z-index:10;

    background:white;
    padding:30px;
    border-radius:25px;

    width:420px;

    text-align:center;

    box-shadow:0 0 25px rgba(0,0,0,0.25);
}

h1{
    color:#ff9800;
    margin-bottom:15px;
}

.passaro{
    width:150px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;

    border-radius:10px;
    border:2px solid #ddd;

    font-size:16px;

    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;

    border:none;
    border-radius:10px;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
    margin-top:10px;
}

#entrar{
    background:#4caf50;
    color:white;
}

#entrar:hover{
    background:#43a047;
}

.ranking{
    margin-top:20px;
    text-align:left;
}

.ranking h2{
    text-align:center;
    color:#ff9800;
    margin-bottom:10px;
}

.ranking p{
    margin:5px 0;
}

</style>
</head>
<body>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<div class="mountain m1"></div>
<div class="mountain m2"></div>
<div class="mountain m3"></div>

<div class="container">

    <h1>🐦 BirdVisionAI</h1>

    <!-- SUA IMAGEM -->
    <img
        src="passaro.png"
        class="passaro"
        alt="Passarinho">

    <input
        type="text"
        id="nome"
        placeholder="Digite seu nome">

    <button id="entrar">
        Jogar
    </button>

    <div class="ranking">
        <h2>🏆 TOP 5 Mundial</h2>

        <div id="rankingInicial">
            Carregando ranking...
        </div>
    </div>

</div>

<script type="module" src="login.js"></script>

<script>
function carregarRankingInicial(){

    const rankingDiv =
        document.getElementById("rankingInicial");

    let ranking =
        JSON.parse(localStorage.getItem("ranking")) || [];

    ranking.sort((a,b)=>b.pontos-a.pontos);

    let html = "";

    ranking.slice(0,5).forEach((jogador,index)=>{

        html += `
            <p>
                ${index+1}º
                ${jogador.nome}
                - ${jogador.pontos}
            </p>
        `;
    });

    if(html===""){
        html="<p>Nenhuma pontuação ainda.</p>";
    }

    rankingDiv.innerHTML = html;
}

carregarRankingInicial();
</script>

</body>
</html>
