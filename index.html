<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BirdVisionAI</title>

<style>

#background{
    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-1;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* PAINEL */

.container{
    position:relative;
    z-index:10;

    width:420px;

    padding:30px;

    background:rgba(255,255,255,0.92);

    backdrop-filter:blur(10px);

    border-radius:25px;

    text-align:center;

    box-shadow:
    0 10px 40px rgba(0,0,0,.25);
}

h1{
    color:#ff9800;
    margin-bottom:15px;
}

.passaro{
    width:150px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;

    border-radius:10px;
    border:2px solid #ddd;

    font-size:16px;

    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;

    border:none;
    border-radius:10px;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
    margin-top:10px;
}

#entrar{
    background:#4caf50;
    color:white;
}

#entrar:hover{
    background:#43a047;
}

.ranking{
    margin-top:20px;
    text-align:left;
}

.ranking h2{
    text-align:center;
    color:#ff9800;
    margin-bottom:10px;
}

.ranking p{
    margin:5px 0;
}


</style>
</head>
<body>
<img src="background-menu.png" id="background">
<div class="container">

    <h1>🐦 BirdVisionAI</h1>


    <input
        type="text"
        id="nome"
        placeholder="Digite seu nome">

    <button id="entrar">
        Jogar
    </button>

    <div class="ranking">
        <h2>🏆 TOP 5 Mundial</h2>

        <div id="rankingInicial">
            Carregando ranking...
        </div>
    </div>

</div>

<script type="module" src="login.js"></script>

<script type="module">

import {
    db,
    ref,
    onValue
} from "./firebase.js";

const rankingDiv =
    document.getElementById("rankingInicial");

onValue(ref(db, "ranking"), (snapshot) => {

    const dados = snapshot.val();

    if (!dados) {
        rankingDiv.innerHTML =
            "<p>Nenhuma pontuação ainda.</p>";
        return;
    }

    const ranking =
        Object.values(dados)
        .sort((a,b) => b.pontos - a.pontos)
        .slice(0,5);

    let html = "";

    ranking.forEach((jogador,index)=>{

        html += `
            <p>
                ${index + 1}º
                ${jogador.nome}
                - ${jogador.pontos}
            </p>
        `;

    });

    rankingDiv.innerHTML = html;

});

</script>
</body>
</html>
